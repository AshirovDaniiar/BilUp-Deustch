name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format (files introduced in P0)
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Content validation (skeleton)
        run: npm run content:validate
      - name: Architecture boundaries (report-only)
        run: npm run boundaries:report
      - name: Production build (to a disposable directory)
        run: npm run build:ci
      - name: Dependency audit (production dependencies, blocking)
        run: npm audit --omit=dev
      - name: Dependency audit (all, informational)
        run: npm audit || true
